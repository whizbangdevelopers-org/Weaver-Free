rules:
  - id: no-user-input-in-path
    message: >
      User-controlled data flows into a filesystem path without sanitization.
      Validate all user-supplied names against a strict allowlist regex (e.g.
      /^[a-z][a-z0-9-]*$/) before constructing file paths. Never use raw
      request data in path.join, path.resolve, or fs calls.
    severity: ERROR
    languages: [typescript]
    mode: taint
    pattern-sources:
      - patterns:
          - pattern: $REQ.params
      - patterns:
          - pattern: $REQ.body
      - patterns:
          - pattern: $REQ.query
      # Shorthand destructuring from a TYPE-ASSERTED request field —
      #   const { name } = request.params as { name: string }
      # — is this codebase's own idiomatic param read, and semgrep's taint engine cannot
      # bind through it: the object-type-literal assertion breaks the destructuring bind
      # in the IL, so the plain `$REQ.params` source above never reaches the variable.
      #
      # Measured against semgrep 1.143.0. EVERY documented taint mechanism fails
      # identically on this shape — cast-as-source ($REQ.params as $T), focus-metavariable
      # on the bound name, by-side-effect on sources AND on propagators,
      # pattern-propagators for the destructuring bind, and symbolic_propagation. The
      # neighbouring shapes all bind correctly: `as any`, renaming ({ name: vmName }), and
      # the two-step (assign the cast, then destructure). It is only shorthand binding
      # against an object-type literal that breaks, which is why this sat undetected — the
      # declared sources describe an ideal, not the engine's reach.
      #
      # So: declare the variable's USES as sources instead, scoped to the enclosing
      # function so a binding cannot leak into a sibling handler in the same file. This
      # stays inside taint mode, so the sanitizers below still apply to it.
      #
      # Known residual limit (corpus-documented, deliberately not papered over): semgrep
      # dedupes on the metavariable binding, so if one file binds the SAME variable name
      # in two handlers and the plain form is already reported, the cast form is masked
      # until the first is fixed. It reappears on the next run — iterative convergence,
      # not a blind spot.
      - patterns:
          - pattern: $VAR
          - pattern-either:
              - pattern-inside: |
                  function (...) {
                    ...
                    const { ..., $VAR, ... } = $REQ.$FIELD as $T
                    ...
                  }
              - pattern-inside: |
                  function $F(...) {
                    ...
                    const { ..., $VAR, ... } = $REQ.$FIELD as $T
                    ...
                  }
          - metavariable-regex:
              metavariable: $FIELD
              regex: ^(params|body|query)$
    pattern-sinks:
      - patterns:
          - pattern: path.join(..., $SINK, ...)
        focus-metavariable: $SINK
      - patterns:
          - pattern: path.resolve(..., $SINK, ...)
        focus-metavariable: $SINK
      - patterns:
          - pattern: readFile($SINK, ...)
        focus-metavariable: $SINK
      - patterns:
          - pattern: readFileSync($SINK, ...)
        focus-metavariable: $SINK
      - patterns:
          - pattern: writeFile($SINK, ...)
        focus-metavariable: $SINK
      - patterns:
          - pattern: writeFileSync($SINK, ...)
        focus-metavariable: $SINK
      - patterns:
          - pattern: unlink($SINK, ...)
        focus-metavariable: $SINK
      - patterns:
          - pattern: mkdir($SINK, ...)
        focus-metavariable: $SINK
    pattern-sanitizers:
      - patterns:
          - pattern: |
              /^[a-z][a-z0-9\-]*$/.test($X)
      - patterns:
          - pattern: |
              /^[a-z][a-z0-9_\-]*$/.test($X)
      - patterns:
          - pattern: |
              /^[a-z][a-z0-9-]*$/.test($X)
      - patterns:
          - pattern: |
              /^[a-z][a-z0-9_-]*$/.test($X)
      # Guard-region sanitizer. The expression-level entries above clean only the
      # occurrence inside the guard call itself; they do NOT clean later uses, so
      # `if (!/re/.test(name)) throw` followed by `execFile(bin, [name])` was reported
      # despite being the sanctioned shape. Both guard polarities are covered.
      #
      # The regex LITERAL is allowlisted via metavariable-regex rather than accepting any
      # $RE.test(): a permissive pattern (/.*/) and a named constant (SAFE_RE) must both
      # fail to sanitize. A constant's NAME is not evidence about the pattern it holds.
      - patterns:
          - pattern: $X
          - pattern-either:
              - pattern-inside: |
                  if (!$RE.test($X)) { ... }
                  ...
              - pattern-inside: |
                  if ($RE.test($X)) { ... }
          - metavariable-regex:
              metavariable: $RE
              regex: '^/\^\[a-z\]\[a-z0-9_?\\?\-\]\*\$/$'
    metadata:
      category: security
      cwe: CWE-22
      owasp: A01:2021
