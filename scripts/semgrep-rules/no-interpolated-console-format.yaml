rules:
  - id: no-interpolated-console-format
    message: >
      A value is interpolated into console's FORMAT string while further arguments follow, so
      Node reads any `%` directive inside it: a `%o` in a workload name consumed the error argument,
      and a newline forged a log line. Use a constant format and pass the value as an argument:
      console.error('[x] Failed %s:', JSON.stringify(name), err).
    # Structural, not taint, and deliberately so. CodeQL's js/tainted-format-string follows a name
    # from the route into the service; semgrep's taint engine here is single-function and cannot.
    # The shape itself is the defect whatever the value's origin, and the constant-format fix is
    # always available, so matching the shape covers the class without a flow. With ONE argument
    # Node prints the string verbatim and reads no directive, so single-argument calls are out of
    # scope — that is the log-injection-only case, which this rule does not claim.
    severity: ERROR
    languages: [typescript]
    patterns:
      - pattern: console.$M(`...${$X}...`, $ARG, ...)
      - metavariable-regex:
          metavariable: $M
          regex: ^(log|info|warn|error|debug|trace)$
    metadata:
      category: security
      cwe: CWE-134
