# CodeQL configuration.
#
# The ONLY exclusion here is the taint auditor's regression corpus. Those files are
# deliberately vulnerable — that is their entire function. They encode the exact command
# injection, path traversal and SSRF flows that `audit:taint`'s semgrep rules must catch,
# plus the guarded shapes they must NOT flag, and the auditor asserts all of it before it
# scans anything real (code/scripts/audit-taint.ts).
#
# Without this exclusion CodeQL analyses them as production TypeScript and reports each
# planted flow as a finding on the public mirror, because `scripts/` is not sync-excluded.
# The result is a security dashboard whose alerts are mostly fixtures — which is how real
# alerts stop being read.
#
# This is a scoped exclusion with a stated reason, not a way to make findings go away
# (~/.claude/rules/never-game-auditors.md). The distinction is checkable:
#
#   - the corpus is never imported, never executed, and never reachable from any entrypoint;
#   - it is not shipped — nothing in src/, backend/src/ or the built artifacts references it;
#   - the flows inside it are asserted BY a scanner on every compliance run, so they are
#     tested more strictly than ordinary code rather than less;
#   - the exclusion names one directory. Application code, scripts and config stay in scope.
#
# The sibling corpus for the secret rules (scripts/fixtures/sast-secret-corpus.txt) needs no
# entry only because CodeQL does not analyse .txt. A taint corpus has to be real compilable
# source — a line-based fixture cannot express data flow — so it needs the exclusion stated.
#
# If a future corpus lands elsewhere, add it here with its own reason. Do not broaden this
# to `**/fixtures/**`: a wildcard would silently exempt any future fixture directory,
# including one that ends up holding real code.
#
# BOTH ANCHORINGS ARE REQUIRED — this one file serves two repos with different tree shapes,
# and the entry that matters is the second one:
#
#   Weaver-Dev   corpus at code/scripts/fixtures/taint-corpus   CodeQL SKIPS (private repo:
#                                                               code scanning needs Advanced
#                                                               Security, see codeql.yml)
#   Weaver-Free  corpus at      scripts/fixtures/taint-corpus   CodeQL RUNS
#
# sync-to-free.yml rsyncs `source/code/ → target/`, so the mirror is FLATTENED: Dev's `code/`
# becomes the Free repo root. A paths-ignore written only for the Dev layout therefore names
# a path that does not exist on the one repo that actually scans — a silent no-op, green in
# review, fixtures alerting in production. Verified against the live mirror rather than
# reasoned about.
#
# This is the "an auditor's universe must match its CONSUMER's" rule from
# .claude/rules/core/single-source-generated.md. Any future entry here needs both forms too.
paths-ignore:
  # Weaver-Free (mirror root — this is the one CodeQL actually evaluates)
  - scripts/fixtures/taint-corpus
  # Weaver-Dev (code/-nested)
  - code/scripts/fixtures/taint-corpus
