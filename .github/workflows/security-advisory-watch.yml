# Security Advisory Watch  (release-patch notification layer)
# CREATED IN: Weaver-Dev
# USED BY: Scheduled, whitelist-aware advisory watch. Routes through the dynamic
#          whitelist (code/scripts/baselines/security-allowlist.json via
#          `npm run audit:security`) so only UNKNOWN high/critical advisories alert.
#          When one is found it opens/updates a single tracking issue so maintainers
#          triage (fix or acknowledge) and cut a patch release for affected shipped
#          versions. Complements the manual security-scan.yml (raw npm audit).
# CONSOLIDATION: the three advisory surfaces (this JSON, .github/audit-exceptions.yml,
#          dependabot-labeler.yml) should converge on one source. Tracked internally.
# TRIGGERS: Weekly schedule + manual dispatch. Validate the first run via dispatch.

name: Security Advisory Watch

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'  # Mondays 09:00 UTC

permissions:
  contents: read

jobs:
  advisory-watch:
    name: Whitelist-aware advisory watch
    runs-on: ubuntu-latest
    # Dev-only, and it must stay that way. `npm run audit:security` resolves to
    # scripts/audit-security.ts, which is sync-excluded — so on Weaver-Free the
    # script is ABSENT and npm exits non-zero for ERR_MODULE_NOT_FOUND. The step
    # below reads any non-zero as "action-required", so a missing file published a
    # false "patch release needed" security issue on the PUBLIC repo (Free #340,
    # closed 2026-07-22: it reported 0 advisories in its own body). Advisory triage
    # belongs on Dev, where the auditor and the allowlist actually live.
    if: github.repository == 'whizbangdevelopers-org/Weaver-Dev'
    permissions:
      contents: read
      issues: write   # open / update the advisory-tracking issue
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: code/package-lock.json

      - name: Install dependencies
        working-directory: code
        run: npm ci

      - name: Whitelist-aware advisory audit
        id: audit
        working-directory: code
        run: |
          if npm run audit:security; then
            echo "status=clean" >> "$GITHUB_OUTPUT"
          else
            echo "status=action-required" >> "$GITHUB_OUTPUT"
          fi

      - name: Open / update advisory-tracking issue
        if: steps.audit.outputs.status == 'action-required'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const fs = require('fs')
            let unknown = []
            // A run can now be non-zero for a SECOND reason: a workspace manifest that could not
            // be scanned at all (unreachable registry, missing lockfile). Before 2026-08-24 the
            // auditor read npm's error envelope as "no advisories" and printed PASS; it now
            // refuses. If that cause is not read out here, the issue body says "0 advisories"
            // while the real message is that nothing was scanned — the same false-reassurance
            // shape that opened Free #340.
            let scanFailures = []
            let baselineFailures = []
            try {
              const r = JSON.parse(fs.readFileSync('code/reports/security-audit/latest.json', 'utf8'))
              unknown = (r.data && r.data.unknown) || []
              scanFailures = (r.data && r.data.scanFailures) || []
              baselineFailures = (r.data && r.data.baselineFailures) || []
            } catch (e) {
              core.warning('security-audit report unreadable: ' + e.message)
            }

            const { owner, repo } = context.repo
            const marker = '<!-- security-advisory-watch -->'
            // The auditor is non-zero for three different reasons and they need three different
            // issues. Reporting all of them as "N unacknowledged advisories" is how a run that
            // scanned NOTHING came to be filed as "0 advisories" (Free #340) — a body that reads
            // as reassurance for a result that is anything but. Pick the cause, then say what to
            // do about THAT cause.
            const cause = unknown.length
              ? {
                  title: '🔒 Unacknowledged high/critical advisories — patch release needed',
                  summary: `The scheduled advisory watch found **${unknown.length}** high/critical advisory(s) not covered by \`code/scripts/baselines/security-allowlist.json\`.`,
                  action: '**Action:** for each, either **fix** (bump within constraint) or **acknowledge** (add a justified, dated entry to the allowlist — `npm run refresh:security-allowlist` to review), then cut a patch release for any affected shipped version.',
                  lines: unknown.map(a => `- \`${a.module}\` ${a.severity} — [${a.ghsa}](${a.url}): ${a.title}`),
                }
              : scanFailures.length
              ? {
                  title: '🔒 Security audit could not scan — advisory state is UNKNOWN, not clean',
                  summary: `The scheduled advisory watch could not scan **${scanFailures.length}** workspace manifest(s). This is **not** a clean result — the advisory state of those manifests is unknown.`,
                  action: '**Action:** restore whatever the audit could not reach (registry, lockfile), then re-run the workflow. Do not read this as "no advisories".',
                  lines: scanFailures.map(f => `- **${f.manifest}** could not be scanned — ${f.detail}`),
                }
              : baselineFailures.length
              ? {
                  title: '🔒 Security baseline regression — a source-level control is below its floor',
                  summary: `The scheduled advisory watch found **${baselineFailures.length}** security baseline failure(s). No dependency advisory is involved.`,
                  action: '**Action:** restore the control to the floor in `code/docs/security/SECURITY-BASELINES.md`. Never lower the baseline to make this pass.',
                  lines: baselineFailures.map(f => `- ${f.label}${f.detail ? ` — ${f.detail}` : ''}`),
                }
              : {
                  title: '🔒 Security audit failed for a cause the report does not name',
                  summary: 'The scheduled advisory watch exited non-zero, and the saved report names no unknown advisory, no scan failure and no baseline failure.',
                  action: '**Action:** read the workflow run logs. A non-zero exit the report cannot explain is itself the finding — the auditor and its report have diverged.',
                  lines: ['- (see the workflow run logs)'],
                }
            const title = cause.title
            const lines = cause.lines
            const body = [
              marker,
              cause.summary,
              '',
              cause.action,
              '',
              ...lines,
              '',
              '_Updated automatically by Security Advisory Watch._',
            ].join('\n')

            // Ensure the label exists (idempotent).
            try {
              await github.rest.issues.getLabel({ owner, repo, name: 'security-advisory' })
            } catch {
              await github.rest.issues.createLabel({ owner, repo, name: 'security-advisory', color: 'b60205', description: 'Unacknowledged dependency advisory needing triage / patch release' })
            }

            const open = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', labels: 'security-advisory' })
            const existing = open.find(i => i.body && i.body.includes(marker))
            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, title, body })
              core.notice(`Updated tracking issue #${existing.number}`)
            } else {
              const created = await github.rest.issues.create({ owner, repo, title, body, labels: ['security-advisory'] })
              core.notice(`Opened tracking issue #${created.data.number}`)
            }
