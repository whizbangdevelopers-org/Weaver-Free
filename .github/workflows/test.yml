# Tests and CI
# CREATED IN: Dev repo
# USED BY: badge updates on release tags only
# TRIGGERS: release tags (badge refresh) + manual dispatch.
#   PR/push test runs are intentionally DROPPED — the Weaver CI (pre-push hook) gates
#   every push to main, and release.yml's `verify` job re-runs the full suite on the
#   release tag. GitHub spends test minutes on releases only.
#
# REQUIRED SECRETS (optional, for dynamic badges):
#   - GIST_TOKEN: PAT with gist scope for updating CI badges
#   - TEST_BADGE_GIST_ID: Gist ID containing badge JSON files
#
# BADGE FILES (written to gist on main push):
#   - vitest-badge.json                  (unit tests)
#   - backend-badge.json                 (backend tests)
#   - tui-badge.json                     (TUI tests)
#   - total-badge.json                   (unit + backend + TUI sum)
#   - compliance-auditors-badge.json     (auditor count from package.json)

name: Tests

on:
  push:
    tags: ['v*']         # Badge refresh on release only — pre-push hook + release.yml verify cover correctness
  workflow_dispatch:       # Manual trigger for debugging

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.vitest.outputs.passed }}
      failed: ${{ steps.vitest.outputs.failed }}
    defaults:
      run:
        # Dev repo: code lives in code/. Free repo: sync flattens code/ → root.
        working-directory: ${{ github.repository == 'whizbangdevelopers-org/Weaver-Dev' && 'code' || '.' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run typecheck
        # Shim files (demo.ts, useDemoContainerState.ts) use `typeof import('./excluded-data')`
        # to derive types. On Free those files don't exist → tsc falls back to any → implicit-any
        # errors in components. Typecheck is authoritative on Dev; skip on Free mirror.
        if: github.repository == 'whizbangdevelopers-org/Weaver-Dev'
        run: npm run typecheck

      - name: Run unit tests
        id: vitest
        run: |
          npm run test:unit:run -- --reporter=json --outputFile=test-results.json || true

          # Extract test counts from JSON output
          if [[ -f test-results.json ]]; then
            PASSED=$(jq '[.testResults[].assertionResults[] | select(.status == "passed")] | length' test-results.json)
            FAILED=$(jq '[.testResults[].assertionResults[] | select(.status == "failed")] | length' test-results.json)
            TOTAL=$((PASSED + FAILED))

            echo "passed=$PASSED" >> $GITHUB_OUTPUT
            echo "failed=$FAILED" >> $GITHUB_OUTPUT
            echo "total=$TOTAL" >> $GITHUB_OUTPUT

            echo "Unit tests: $PASSED passed, $FAILED failed, $TOTAL total"
          fi

          # Fail if tests failed
          if [[ "$FAILED" -gt 0 ]]; then
            exit 1
          fi

      - name: Run tests with coverage
        run: npm run test:coverage
        continue-on-error: true

      - name: Update test badge
        if: github.repository == 'whizbangdevelopers-org/Weaver-Dev' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910  # v1.9.0
        with:
          auth: ${{ secrets.WEAVER_FREE_GIST_TOKEN }}
          gistID: ${{ secrets.TEST_BADGE_GIST_ID }}
          filename: vitest-badge.json
          label: unit tests
          message: "${{ steps.vitest.outputs.passed }} passed"
          color: ${{ steps.vitest.outputs.failed == '0' && 'brightgreen' || 'red' }}
        continue-on-error: true

      - name: Upload coverage report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        if: always()
        with:
          name: coverage-report
          path: code/coverage/
          retention-days: 30

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.backend-vitest.outputs.passed }}
      failed: ${{ steps.backend-vitest.outputs.failed }}
    defaults:
      run:
        working-directory: ${{ github.repository == 'whizbangdevelopers-org/Weaver-Dev' && 'code' || '.' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'

      - name: Install dependencies (workspaces)
        run: npm ci

      - name: Run backend linter
        run: cd backend && npm run lint

      - name: Run backend typecheck
        if: github.repository == 'whizbangdevelopers-org/Weaver-Dev'
        run: cd backend && npm run typecheck

      - name: Run backend tests
        id: backend-vitest
        run: |
          cd backend
          npx vitest run --reporter=json --outputFile=test-results.json || true

          # Extract test counts from JSON output
          if [[ -f test-results.json ]]; then
            PASSED=$(jq '[.testResults[].assertionResults[] | select(.status == "passed")] | length' test-results.json)
            FAILED=$(jq '[.testResults[].assertionResults[] | select(.status == "failed")] | length' test-results.json)
            TOTAL=$((PASSED + FAILED))

            echo "passed=$PASSED" >> $GITHUB_OUTPUT
            echo "failed=$FAILED" >> $GITHUB_OUTPUT
            echo "total=$TOTAL" >> $GITHUB_OUTPUT

            echo "Backend tests: $PASSED passed, $FAILED failed, $TOTAL total"
          fi

          # Fail if tests failed
          if [[ "$FAILED" -gt 0 ]]; then
            exit 1
          fi

      - name: Update backend test badge
        if: github.repository == 'whizbangdevelopers-org/Weaver-Dev' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910  # v1.9.0
        with:
          auth: ${{ secrets.WEAVER_FREE_GIST_TOKEN }}
          gistID: ${{ secrets.TEST_BADGE_GIST_ID }}
          filename: backend-badge.json
          label: backend tests
          message: "${{ steps.backend-vitest.outputs.passed }} passed"
          color: ${{ steps.backend-vitest.outputs.failed == '0' && 'brightgreen' || 'red' }}
        continue-on-error: true

  tui-tests:
    name: TUI Tests
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.tui-vitest.outputs.passed }}
      failed: ${{ steps.tui-vitest.outputs.failed }}
    defaults:
      run:
        working-directory: ${{ github.repository == 'whizbangdevelopers-org/Weaver-Dev' && 'code' || '.' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'

      - name: Install dependencies (workspaces)
        run: npm ci

      - name: Run TUI typecheck
        if: github.repository == 'whizbangdevelopers-org/Weaver-Dev'
        run: cd tui && npm run typecheck

      - name: Run TUI tests
        id: tui-vitest
        run: |
          cd tui
          npx vitest run --reporter=json --outputFile=test-results.json || true

          # Extract test counts from JSON output
          if [[ -f test-results.json ]]; then
            PASSED=$(jq '[.testResults[].assertionResults[] | select(.status == "passed")] | length' test-results.json)
            FAILED=$(jq '[.testResults[].assertionResults[] | select(.status == "failed")] | length' test-results.json)
            TOTAL=$((PASSED + FAILED))

            echo "passed=$PASSED" >> $GITHUB_OUTPUT
            echo "failed=$FAILED" >> $GITHUB_OUTPUT
            echo "total=$TOTAL" >> $GITHUB_OUTPUT

            echo "TUI tests: $PASSED passed, $FAILED failed, $TOTAL total"
          fi

          # Fail if tests failed
          if [[ "$FAILED" -gt 0 ]]; then
            exit 1
          fi

      - name: Update TUI test badge
        if: github.repository == 'whizbangdevelopers-org/Weaver-Dev' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910  # v1.9.0
        with:
          auth: ${{ secrets.WEAVER_FREE_GIST_TOKEN }}
          gistID: ${{ secrets.TEST_BADGE_GIST_ID }}
          filename: tui-badge.json
          label: tui tests
          message: "${{ steps.tui-vitest.outputs.passed }} passed"
          color: ${{ steps.tui-vitest.outputs.failed == '0' && 'brightgreen' || 'red' }}
        continue-on-error: true

  # Aggregates unit + backend + TUI pass/fail counts into a single total badge.
  # E2E is intentionally excluded — it runs via `update-e2e-badge.yml` manual
  # dispatch after `test:prerelease`, per the repo testing policy. The
  # "total" here is the CI-run suite total, not the release-gate total.
  total-tests-badge:
    name: Total Tests Badge
    needs: [unit-tests, backend-tests, tui-tests]
    runs-on: ubuntu-latest
    # The repository check is NOT optional here, and its absence was invisible.
    # Every other badge step in this file carries it; this job did not. Weaver-Free
    # receives a `v*` tag from release-to-free, so this job RAN there on v1.0.5 —
    # with WEAVER_FREE_GIST_TOKEN and TEST_BADGE_GIST_ID unset, because those
    # secrets live only on Weaver-Dev. The action logged
    # `##[error]Failed to get gist: 404 Not Found`, and `continue-on-error: true`
    # below reported the step as SUCCESS to the API, the job, and the workflow.
    # The only place the failure existed was the raw log.
    if: github.repository == 'whizbangdevelopers-org/Weaver-Dev' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - name: Sum pass/fail counts across suites
        id: totals
        run: |
          PASSED=$(( ${{ needs.unit-tests.outputs.passed }} + ${{ needs.backend-tests.outputs.passed }} + ${{ needs.tui-tests.outputs.passed }} ))
          FAILED=$(( ${{ needs.unit-tests.outputs.failed }} + ${{ needs.backend-tests.outputs.failed }} + ${{ needs.tui-tests.outputs.failed }} ))
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "Total: $PASSED passed, $FAILED failed"

      - name: Update total-tests badge
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910  # v1.9.0
        with:
          auth: ${{ secrets.WEAVER_FREE_GIST_TOKEN }}
          gistID: ${{ secrets.TEST_BADGE_GIST_ID }}
          filename: total-badge.json
          label: tests
          message: "${{ steps.totals.outputs.passed }} passing"
          color: ${{ steps.totals.outputs.failed == '0' && 'brightgreen' || 'red' }}
        continue-on-error: true

  compliance:
    name: Compliance Auditors
    # Many compliance scripts are sync-excluded (tier-parity, route-auth, doc-parity, etc.).
    # Running the suite on Free would fail on missing scripts. Compliance is authoritative
    # on Dev; skip entirely on the Free mirror.
    if: github.repository == 'whizbangdevelopers-org/Weaver-Dev'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0  # Full history — git log used by feature-lifecycle generator

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'

      - name: Install semgrep (audit:taint refuses to run without it)
        # PINNED to match the project devShell. audit:taint used to warn-and-pass when semgrep was
        # absent, so CI reported green while running no taint analysis at all — every release
        # from v1.0.4 to v1.0.5 inclusive. 1f277c5e made a missing engine a hard failure, and
        # this is the other half of that fix: give CI the engine rather than let it skip.
        # NOT ALLOW_MISSING_SEMGREP=1 — that would restore the exact false green, at the
        # release gate of all places.
        run: pipx install semgrep==1.143.0
      - name: Install dependencies (workspaces)
        run: npm ci

      - name: Build TUI (needed for cli-args audit)
        run: npm run build:tui

      - name: Run security audit
        run: npm run test:security

      - name: Run compliance suite
        run: npm run test:compliance

      # Derive the auditor count from PHASES in scripts/run-compliance.ts
      # (single source of truth — the same value audit:marker-sync verifies in
      # the docs). Runs after the suite passes so a failing compliance run
      # never writes a "green" badge.
      - name: Compute auditor count
        id: auditors
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: |
          COUNT=$(npx tsx -e "import { PHASES } from './scripts/run-compliance.ts'; const all = PHASES.flatMap(p => p.entries).filter(e => e !== 'build:tui'); process.stdout.write(String(all.length));")
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "Auditors: $COUNT"

      - name: Update compliance-auditors badge
        if: github.repository == 'whizbangdevelopers-org/Weaver-Dev' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910  # v1.9.0
        with:
          auth: ${{ secrets.WEAVER_FREE_GIST_TOKEN }}
          gistID: ${{ secrets.TEST_BADGE_GIST_ID }}
          filename: compliance-auditors-badge.json
          label: compliance
          message: "${{ steps.auditors.outputs.count }} auditors"
          color: blue
        continue-on-error: true

  build:
    name: Build
    # Quasar build runs an embedded typecheck pass. On Free, excluded shim files
    # cause type errors that fail the build. Build correctness is verified on Dev.
    if: github.repository == 'whizbangdevelopers-org/Weaver-Dev'
    runs-on: ubuntu-latest
    needs: [unit-tests]
    defaults:
      run:
        working-directory: code

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Build SPA
        run: npm run build
