# Code Scanning Audit
# CREATED IN: Weaver-Dev (synced to Weaver-Free)
# USED BY: Security posture — classifies CodeQL alerts into production failures vs. warnings
# TRIGGERS: After CodeQL Analysis completes on main, release tags, manual dispatch

name: Code Scanning Audit

on:
  workflow_run:
    workflows: ["CodeQL Analysis"]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:

# Minimal permissions: read code scanning alerts, read repo content
permissions:
  contents: read
  security-events: read

jobs:
  audit:
    name: Audit CodeQL Findings
    # Only meaningful on the public repo where CodeQL runs
    if: github.event.repository.visibility != 'private' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: code/package-lock.json

      - name: Install dependencies
        working-directory: code
        run: npm ci --ignore-scripts

      - name: Run code scanning audit
        working-directory: code
        env:
          GH_TOKEN: ${{ secrets.WEAVER_FREE_CODEQL_READ }}
        run: |
          npx tsx scripts/audit-code-scanning.ts 2>&1 | tee /tmp/audit-output.txt
          echo "AUDIT_EXIT=${PIPESTATUS[0]}" >> $GITHUB_ENV

      - name: Post job summary
        if: always()
        run: |
          echo "## Code Scanning Audit" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ -f /tmp/audit-output.txt ]; then
            cat /tmp/audit-output.txt >> $GITHUB_STEP_SUMMARY
          else
            echo "(audit did not run — see the failing step above)" >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Report audit outcome
        if: env.AUDIT_EXIT != '0'
        run: |
          if [ "$AUDIT_EXIT" = "2" ]; then
            echo "::error::The code-scanning audit could not run (auth or fetch failure) — this is NOT a security finding. See the job summary."
          else
            echo "::error::Production security findings detected. See job summary for details."
          fi
          exit 1
