# Public Demo Deployment
# CREATED IN: Dev repo
# USED BY: Tag-based deployment of public demo to GitHub Pages
# TRIGGERS: demo/* tag push, manual dispatch
#
# The public demo is a marketing funnel, not the private QA demo.
# Tag with demo/vX.Y to deploy (e.g., demo/v1.0). Private demo tracks main.
#
# REQUIRED SECRETS:
#   - WEAVER_FREE_DEMO: PAT from weaver-dev account with repo scope
#     (tier-prefixed convention — matches WEAVER_FREE_SYNC)
#   - VITE_HCAPTCHA_SITEKEY: hCaptcha site key for demo login

name: Demo Deploy

on:
  push:
    tags: ['demo/*']
  workflow_dispatch:

env:
  DEMO_REPO: weaver-dev/weaver-dev.github.io

permissions: read-all

jobs:
  build-and-deploy:
    name: Build and Deploy Demo
    runs-on: ubuntu-latest
    # Dev-only. This workflow is synced to Weaver-Free but must never fire there:
    # it needs WEAVER_FREE_DEMO (a secret that exists only on Dev) and publishes to
    # weaver-dev.github.io. Same gate test.yml uses for its Dev-only jobs.
    if: github.repository == 'whizbangdevelopers-org/Weaver-Dev'

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          # persist-credentials: false is REQUIRED because this job pushes to a DIFFERENT repo.
          #
          # The default (true) writes GITHUB_TOKEN into this working copy's git config as
          # `http.https://github.com/.extraheader`. That header is sent on every github.com
          # request from this checkout — including the deploy step's push to the demo repo — and it
          # OVERRIDES the credential in the push URL. So the deploy authenticated as
          # `github-actions[bot]` no matter how good WEAVER_FREE_DEMO was, and failed with
          # `remote: Permission to weaver-dev/weaver-dev.github.io.git denied to
          # github-actions[bot]` → 403.
          #
          # That signature reads like an expired or wrongly-scoped PAT, so it sent two separate
          # rotations chasing a credential that may have been fine the whole time — the exact
          # wasted move the rotation runbook warns about. The tell is the IDENTITY in the error: a
          # bad PAT is refused as its own owner, never as the bot.
          persist-credentials: false
          # Detached HEAD, so the source checkout does not hold `main` while the deploy action
          # tries to create `main` for the target repo in a second worktree — the
          # `fatal: 'main' is already used by worktree` line the deploy step recovers from noisily.
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: code/package-lock.json

      - name: Install dependencies
        working-directory: code
        run: npm ci

      - name: Build SPA for public demo
        working-directory: code
        env:
          VITE_DEMO_MODE: 'true'
          VITE_DEMO_PUBLIC: 'true'
          VITE_HCAPTCHA_SITEKEY: ${{ secrets.VITE_HCAPTCHA_SITEKEY }}
        run: npx quasar build -m spa

      - name: Prepare deployment
        run: |
          # Create .nojekyll for GitHub Pages
          touch code/dist/spa/.nojekyll

          # Copy demo README if exists
          if [ -f code/demo/DEMO-README.md ]; then
            cp code/demo/DEMO-README.md code/dist/spa/README.md
          fi

          # Include license in demo build
          cp code/LICENSE code/dist/spa/LICENSE

          # Block AI crawlers from using the demo as training data
          if [ -f code/demo/robots.txt ]; then
            cp code/demo/robots.txt code/dist/spa/robots.txt
          fi

          # Inject noai meta tags into index.html (after charset meta)
          sed -i 's|<meta charset="utf-8">|<meta charset="utf-8">\n    <meta name="robots" content="noai, noimageai">|' code/dist/spa/index.html

          # Inject Content-Security-Policy meta tag (GitHub Pages can't set HTTP headers).
          # X-Frame-Options / X-Content-Type-Options cannot be set via meta; the WBD-hosted
          # deployment will add those at the HTTP layer. frame-ancestors replaces X-Frame-Options in modern browsers.
          CSP="default-src 'self'; script-src 'self' https://js.hcaptcha.com https://*.hcaptcha.com; style-src 'self' 'unsafe-inline' https://*.hcaptcha.com; img-src 'self' data: blob: https://*.hcaptcha.com; font-src 'self' data:; connect-src 'self' https://*.hcaptcha.com; frame-src https://*.hcaptcha.com https://newassets.hcaptcha.com; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'"
          sed -i "s|<meta name=\"robots\" content=\"noai, noimageai\">|<meta name=\"robots\" content=\"noai, noimageai\">\n    <meta http-equiv=\"Content-Security-Policy\" content=\"${CSP}\">|" code/dist/spa/index.html

      - name: Deploy to demo repo
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f  # v4
        with:
          token: ${{ secrets.WEAVER_FREE_DEMO }}
          repository-name: ${{ env.DEMO_REPO }}
          branch: main
          folder: code/dist/spa
          clean-exclude: README.md
          commit-message: "Deploy demo app - ${{ github.sha }}"

      - name: Summary
        run: |
          DEMO_ACCOUNT="${{ env.DEMO_REPO }}"
          DEMO_ACCOUNT="${DEMO_ACCOUNT%%/*}"
          echo "## Public Demo Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- URL: https://${DEMO_ACCOUNT}.github.io" >> $GITHUB_STEP_SUMMARY
          echo "- Ref: ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Demo mode: enabled (public)" >> $GITHUB_STEP_SUMMARY
