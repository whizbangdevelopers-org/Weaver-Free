# Security Vulnerability Scan
# CREATED IN: All repos (Dev, Public, Premium, Enterprise, Plugins)
# USED BY: Dependency vulnerability scanning (npm advisory DB — complements Socket's
#          supply-chain focus and CodeQL's SAST; the only npm-audit signal on Free)
# TRIGGERS: Manual (both repos) + weekly schedule (PUBLIC Free repo only).
#   The schedule is Free-only by design. On the public mirror, scheduled dependency
#   scanning is read-only observation — valuable for trust + OpenSSF Scorecard, and the
#   only place npm audit runs there (Security Advisory Watch is Dev-gated; Dependabot is
#   excluded from the mirror because it MUTATES via PRs a force-pushed mirror can't accept).
#   On private Dev the scheduled run is skipped to save CI minutes; dispatch still works.
#   (Left commented as "uncomment for public" from 2026-03 until 2026-07-22, so it ran
#    NOWHERE — an active workflow with zero runs, the demo-reset/e2e-badge class.)

name: Security Scan

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday 09:00 UTC — gated to the Free repo in the job `if`
  # pull_request paths trigger intentionally NOT enabled: Dev is private (save minutes)
  # and Free is a force-pushed mirror that does not receive PRs.

permissions: read-all

jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    # A manual dispatch runs on whichever repo triggered it. A SCHEDULED run only executes
    # on the public Free repo — the file lives on both repos, so without this gate the weekly
    # cron would also fire on private Dev and burn the CI minutes the "manual only" design
    # exists to save. Dispatch stays available on both.
    if: >-
      github.event_name != 'schedule' ||
      github.repository == 'whizbangdevelopers-org/Weaver-Free'

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ${{ github.repository == 'whizbangdevelopers-org/Weaver-Dev' && 'code/package-lock.json' || 'package-lock.json' }}

      - name: Install dependencies
        working-directory: ${{ github.repository == 'whizbangdevelopers-org/Weaver-Dev' && 'code' || '.' }}
        run: npm ci

      # BLOCKING as of 2026-08-19. It carried `continue-on-error: true`, and while it did,
      # @fastify/static sat at 9.3.0 against two advisories — one an authorization bypass via
      # non-canonical URL paths, the other a route guard bypass via path traversal — in a module
      # registered at the root serving the SPA, on a request path the auth middleware explicitly
      # skips (`if (!path.startsWith('/api/')) return`). The audit reported it on every run.
      #
      # What made that costly rather than merely untidy: our own security review had already
      # accepted a related risk on the stated grounds that "npm audit in CI catches known
      # vulnerabilities". A control configured never to fail is not a control, and recording one
      # as a mitigation converts a visible finding into an invisible one.
      #
      # If a finding here is genuinely acceptable, record it in the audit report step's summary
      # and add an explicit, dated exception — never restore continue-on-error.
      - name: Run npm audit
        working-directory: ${{ github.repository == 'whizbangdevelopers-org/Weaver-Dev' && 'code' || '.' }}
        run: npm audit --audit-level=high

      - name: Generate audit report
        working-directory: ${{ github.repository == 'whizbangdevelopers-org/Weaver-Dev' && 'code' || '.' }}
        run: |
          echo "## Security Audit Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Generated: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          npm audit 2>&1 | head -100 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Check for critical vulnerabilities
        working-directory: ${{ github.repository == 'whizbangdevelopers-org/Weaver-Dev' && 'code' || '.' }}
        run: |
          # Fail only on critical vulnerabilities
          CRITICAL=$(npm audit --json 2>/dev/null | jq '.metadata.vulnerabilities.critical // 0')
          if [ "$CRITICAL" -gt 0 ]; then
            echo "::error::Found $CRITICAL critical vulnerabilities!"
            exit 1
          fi
          echo "No critical vulnerabilities found"

      - name: Check production audit (--omit=dev)
        working-directory: ${{ github.repository == 'whizbangdevelopers-org/Weaver-Dev' && 'code' || '.' }}
        run: |
          echo "## Production Audit (--omit=dev)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          # Frontend
          echo "### Frontend" >> $GITHUB_STEP_SUMMARY
          if npm audit --omit=dev 2>&1 | grep -q "found 0 vulnerabilities"; then
            echo "✅ Clean" >> $GITHUB_STEP_SUMMARY
          else
            echo '```' >> $GITHUB_STEP_SUMMARY
            npm audit --omit=dev 2>&1 | head -50 >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          # Backend
          echo "### Backend" >> $GITHUB_STEP_SUMMARY
          cd backend
          if npm audit --omit=dev 2>&1 | grep -q "found 0 vulnerabilities"; then
            echo "✅ Clean" >> $GITHUB_STEP_SUMMARY
          else
            echo '```' >> $GITHUB_STEP_SUMMARY
            npm audit --omit=dev 2>&1 | head -50 >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Validate exceptions manifest
        run: |
          # Cross-reference: .github/audit-exceptions.yml is the source of truth
          # for approved vulnerabilities. All non-excepted production vulns must fail.
          EXCEPTIONS_FILE=".github/audit-exceptions.yml"
          if [ -f "$EXCEPTIONS_FILE" ]; then
            EXCEPTION_COUNT=$(grep -c "ghsa:" "$EXCEPTIONS_FILE" || echo 0)
            echo "📋 $EXCEPTION_COUNT approved audit exceptions on file"
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Audit Exceptions" >> $GITHUB_STEP_SUMMARY
            echo "$EXCEPTION_COUNT approved exceptions — see .github/audit-exceptions.yml" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ No audit-exceptions.yml found"
          fi
